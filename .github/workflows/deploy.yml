name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/puffersoft-ai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: AWS-Deployment 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME
          script: |
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Pull latest image
            docker pull $IMAGE_NAME:latest

            # Stop and remove old container
            docker stop puffersoft-ai || true
            docker rm puffersoft-ai || true

            # Run new container (without cert mounts)
            docker run -d \
              --name puffersoft-ai \
              --restart unless-stopped \
              -p 7860:7860 \
              $IMAGE_NAME:latest

            # Clean up old images
            docker image prune -f